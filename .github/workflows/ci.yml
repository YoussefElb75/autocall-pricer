name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check
        run: mypy
      - name: Tests (incl. QuantLib validation)
        run: pytest -v
      - name: Execute demo notebook
        run: jupyter nbconvert --to notebook --execute notebooks/demo.ipynb --output-dir /tmp --ExecutePreprocessor.timeout=600
